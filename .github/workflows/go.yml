name: Go

on:
  push:
    branches: [ master ]
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ master ]
    # types: [assigned, opened, synchronize, reopened]

#on: [push, pull_request]

env:
  OSes: windows linux darwin
  ARCHes: amd64 arm64
  APPNAME: "evendeep"
  APPS: ""                    # optional, a space separated name list.
  FROM_FOLDER: "."            # Use "." for building "cli"; use "./_examples" for building them
  IMAGE_NAME: ""
  ENABLE_DOCKER: 0
  ENABLE_Apps_Building: 1
  ENABLE_FULL_ARCHes_TEST: 0
  ENABLE_Coveralls_Sender: 0
  ENABLE_Simple_Release: 1    # simple (1), or normal (0): build+docker+brew+release
  ENABLE_Homebrew: 0
  #HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  #GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.26.x ]   # 1.11.x, 1.12.x, 1.13.x,
        #os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ ubuntu-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Test
        run: |
          if [[ $ENABLE_FULL_ARCHes_TESTS -eq 1 ]]; then
            for GOOS in $(go tool dist list|awk -F'/' '{print $1}'|sort -u); do
              echo -e "\n\nTESTING FOR $GOOS ...\n"
              go test ./...
            done
          else
            # GOSUMDB=off go mod download
            go mod download
            # go install -v github.com/swaggo/swag/cmd/swag
            # go generate ./...
            [ -d ./cli ] && go build -v ./cli/... || go build -v ./...
            go test -v ./...
          fi

  coverage:
    needs: test
    env:
      COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Checkout code
        uses: actions/checkout@v4
        #with:
        #  path: ./src/github.com/${{ github.repository }}
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Test & Coverage
        run: |
          # go install -v github.com/swaggo/swag/cmd/swag
          # go generate ./...
          go test -v -coverprofile=profile.cov ./...
      # notifies coveralls that all test jobs are finished
      - name: Send coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: shogo82148/actions-goveralls@v1
        if: startsWith(github.ref, 'refs/tags/v') && env.ENABLE_Coveralls_Sender != 0
        #if: env.ENABLE_Coveralls_Sender != 0
        with:
          path-to-profile: profile.cov
          # parallel: true
          # parallel-finished: true



  do-release:
    permissions: write-all # this is the FIX
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Release
      #   uses: softprops/action-gh-release@v2
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     generate_release_notes: true
      #     repo_token: ${{ secrets.GITHUB_TOKEN }}
      #     tag: ${{ github.ref }}
      #     overwrite: true
      #     file_glob: true
      #     # body: |
      #     #   ${{ steps.read_release_notes_0.outputs.RELEASE_BODY }}
      #     # body_path: ${{ github.workspace }}-CHANGELOG.txt
      #     # body_path: RELNOTES.md
      #     # files: |
      #     #   LICENSE
      #     #   RELNOTES.md

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          discussion_category_name: Announcements
          # # repo_token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # # tag: ${{ github.ref }}
          # tag_name: ${{ github.ref_name }}
          # name: ${{ env.TAG_NAME }}
          # # overwrite: true
          # overwrite_files: true
          file_glob: true
          append_body: true
          draft: false
          prerelease: false
          preserve_order: true
          # body_path: relnotes.md
          body: |
            `evendeep` provides deepcopy, deepequal, and deepdiff utilities.

            ${{ github.event.head_commit.message }}
